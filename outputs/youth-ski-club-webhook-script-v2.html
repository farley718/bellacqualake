<!-- =========================================================
     Youth Ski Club form → (1) Bell Acqua app (nurture emails from
     info@bellacqualakes.com) and (2) GoHighLevel inbound webhook (CRM).
     Replace the ENTIRE existing <script>...</script> block at the
     bottom of the Youth Ski Club landing page with this one.
     v2 — 2026-10-01: adds the app lead record + app email.
     ========================================================= -->
<script>
(function () {
  var GHL_WEBHOOK_URL = "https://services.leadconnectorhq.com/hooks/rqN9GeQaEfpisadTVaUO/webhook-trigger/5567acbc-46db-423e-b9bc-aa1ce705cd5d";
  var SUPABASE_URL    = "https://euznpkrkkaieykznztho.supabase.co";
  var SUPABASE_ANON   = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1em5wa3Jra2FpZXlrem56dGhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NDgxNTAsImV4cCI6MjA5MTMyNDE1MH0.Krku7-ccJvENFPZpwxfQlJL8FANlFAyiwF31mJEeUE0";

  var form    = document.getElementById('ysc-form');
  var success = document.getElementById('form-success');
  if (!form) return;

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    var btn = form.querySelector('.book-submit');
    var originalLabel = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }

    var parentName = (form['parent-name'].value || '').trim();
    var parts      = parentName.split(/\s+/);
    var firstName  = parts.shift() || '';
    var lastName   = parts.join(' ');
    var email      = (form['email'].value || '').trim();
    var phone      = (form['phone'].value || '').trim();

    var payload = {
      first_name: firstName, last_name: lastName, name: parentName,
      email: email, phone: phone,
      parent_name: parentName,
      skier_name: (form['skier-name'].value || '').trim(),
      skier_age: form['skier-age'].value || '',
      preferred_schedule: form['schedule'].value || '',
      program: 'Youth Ski Club — Fall 2026',
      season: 'Sept 15 – Oct 31, 2026',
      price: '$2,000',
      source: 'Youth Ski Club Landing Page',
      page_url: window.location.href,
      submitted_at: new Date().toISOString()
    };

    function showSuccess() {
      form.style.display = 'none';
      if (success) success.style.display = 'block';
      if (success && success.scrollIntoView) success.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    function showError() {
      if (btn) { btn.disabled = false; btn.textContent = originalLabel; }
      alert("Sorry — we couldn't submit that. Please try again, or call us at (916) 919-5726.");
    }

    // (1) App: save the lead, then send nurture email 1 right away.
    //     Emails 2–5 go out automatically over the next week from the app,
    //     and stop the moment this parent pays.
    var sbHeaders = { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON };
    var appLead = fetch(SUPABASE_URL + '/rest/v1/ysc_leads', {
      method: 'POST',
      headers: Object.assign({ 'Prefer': 'return=representation' }, sbHeaders),
      body: JSON.stringify({
        first_name: firstName, last_name: lastName, email: email, phone: phone,
        skier_name: payload.skier_name, skier_age: payload.skier_age,
        preferred_schedule: payload.preferred_schedule, page_url: payload.page_url
      })
    }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (rows) {
        var lead = rows && rows[0];
        if (!lead) return;
        return fetch(SUPABASE_URL + '/functions/v1/send-email', {
          method: 'POST', headers: sbHeaders,
          body: JSON.stringify({ event: 'ysc_lead', lead_id: lead.id })
        });
      }).catch(function () {});

    // (2) GoHighLevel: CRM contact + tags (no email steps needed there any more).
    var ghl = fetch(GHL_WEBHOOK_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
    }).then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); })
      .catch(function () {
        return fetch(GHL_WEBHOOK_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(payload) });
      });

    Promise.all([appLead, ghl]).then(showSuccess).catch(showError);
  });
})();
</script>
